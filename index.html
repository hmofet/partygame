<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Party Game</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --dark: #2C3E50;
            --light: #F7FFF7;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--secondary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        #game-container {
            background-color: var(--light);
            width: 85%;
            max-width: 500px;
            height: 70%;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            transition: transform 0.1s;
            pointer-events: none;
        }

        h1 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #activity-text {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--dark);
            margin: 20px 0;
            line-height: 1.3;
        }

        #instruction {
            color: #888;
            font-size: 1rem;
            margin-top: auto;
        }

        /* Overlay */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            /* Important: Ensure button is clickable */
            pointer-events: auto; 
            touch-action: manipulation;
        }

        #debug-log {
            position: absolute;
            bottom: 5px;
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        .shake-anim {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body onclick="handleTap()">

    <div id="start-overlay">
        <h2>Ready to Play?</h2>
        <p>Tap Start to enable motion sensors.</p>
        <p style="font-size: 0.9rem; opacity: 0.8;">(If shaking doesn't work, you can just tap the screen!)</p>
        <button class="btn" id="start-btn">START GAME</button>
    </div>

    <div id="game-container">
        <h1>Do This!</h1>
        <div id="activity-text">Tap or Shake!</div>
        <p id="instruction">Tap anywhere for next</p>
    </div>

    <div id="debug-log">Waiting for start...</div>

    <script>
        // --- 1. GAME DATA GENERATION ---
        const activities = [];
        const animals = ["Lion", "T-Rex", "Frog", "Bunny", "Snake", "Monkey", "Elephant", "Chicken", "Cat", "Dog", "Robot", "Zombie", "Ghost"];
        const animalActions = ["Walk like a", "Sound like a", "Eat like a", "Dance like a"];
        const colors = ["Red", "Blue", "Green", "Yellow", "Purple", "Orange"];
        const searchActions = ["Find something", "Touch something", "Point to something"];
        const sillyVerbs = ["Wiggle", "Shake", "Tap", "Rub", "Hide"];
        const bodyParts = ["Nose", "Ear", "Knee", "Elbow", "Foot", "Tummy", "Head"];
        
        animals.forEach(a => animalActions.forEach(ac => activities.push(`${ac} ${a}!`)));
        colors.forEach(c => searchActions.forEach(ac => activities.push(`${ac} ${c}!`)));
        bodyParts.forEach(p => sillyVerbs.forEach(v => activities.push(`${v} your ${p}!`)));

        const tasks = [
            "Do a silly dance", "Sing a song", "Freeze!", "Spin 3 times",
            "5 Jumping Jacks", "Melt like ice cream", "Robot voice", "Tell a joke",
            "High-five someone", "Fart noise!", "Balance on one leg", "Cross eyes",
            "Puff cheeks", "Drive a race car", "Air guitar", "Drum on tummy",
            "Walk backwards", "Baby crawl", "Swim on floor", "Act like Grandma",
            "Lift heavy rock", "Slow motion", "Fast motion", "Be invisible",
            "Whisper name", "Yell name", "Clap 7 times", "Stomp feet",
            "Fly like bird", "Ants in pants", "Hug yourself", "Fish face"
        ];
        tasks.forEach(t => activities.push(t));
        // Add Simon Says variations
        const len = activities.length;
        for(let i=0; i<len; i++) activities.push("Simon Says: " + activities[i]);
        activities.sort(() => Math.random() - 0.5);

        // --- 2. LOGIC ---
        const textElement = document.getElementById('activity-text');
        const container = document.getElementById('game-container');
        const debug = document.getElementById('debug-log');
        const overlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        
        let lastShakeTime = 0;
        let shakeThreshold = 15;

        // BIND CLICK EVENT DIRECTLY
        // This is crucial for iOS. The listener must be attached in JS, not HTML onclick="" sometimes
        startBtn.addEventListener('click', function(e) {
            e.stopPropagation(); // Stop the click from triggering "handleTap" immediately
            
            // 1. Hide Overlay immediately so game feels responsive
            overlay.style.display = 'none';
            newActivity();

            // 2. Request Permissions (iOS 13+)
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            debug.innerText = "iOS Sensors: Active";
                            window.addEventListener('devicemotion', handleMotion, true);
                        } else {
                            debug.innerText = "iOS Permission Denied (Use Tap)";
                        }
                    })
                    .catch(err => {
                        debug.innerText = "iOS Error: " + err.message;
                    });
            } 
            // 3. Android / Non-iOS
            else {
                // Try Modern Generic Sensor API (Android Chrome)
                if ('LinearAccelerationSensor' in window) {
                    try {
                        const sensor = new LinearAccelerationSensor({ frequency: 60 });
                        sensor.addEventListener('reading', () => {
                            const total = Math.abs(sensor.x) + Math.abs(sensor.y) + Math.abs(sensor.z);
                            if (total > shakeThreshold) checkShake();
                        });
                        sensor.start();
                        debug.innerText = "Android Sensor: Active";
                    } catch (err) {
                        debug.innerText = "Sensor API Error (Use Tap)";
                    }
                } 
                // Try Legacy DeviceMotion (Older Android)
                else if ('ondevicemotion' in window) {
                    window.addEventListener('devicemotion', handleMotion, true);
                    debug.innerText = "Legacy Sensor: Active";
                } else {
                    debug.innerText = "No Sensors Found (Use Tap)";
                }
            }
        });

        function handleTap() {
            // This allows clicking anywhere to play, even if sensors fail
            newActivity();
        }

        function newActivity() {
            // Animation
            container.classList.remove('shake-anim');
            void container.offsetWidth; 
            container.classList.add('shake-anim');

            // Text
            const randomActivity = activities[Math.floor(Math.random() * activities.length)];
            textElement.innerText = randomActivity;

            // Color
            const bgColors = ['#4ECDC4', '#FF6B6B', '#FFE66D', '#1A535C', '#FF9F1C'];
            document.body.style.backgroundColor = bgColors[Math.floor(Math.random() * bgColors.length)];
        }

        function handleMotion(event) {
            // Legacy/iOS Motion Handler
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            // Calculate Speed
            const speed = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
            
            // Threshold (Gravity is ~9.8 per axis, so 25 is a decent shake)
            if (speed > 25) {
                checkShake();
            }
        }

        function checkShake() {
            const currentTime = Date.now();
            if ((currentTime - lastShakeTime) > 1000) { // 1 second cooldown
                lastShakeTime = currentTime;
                newActivity();
            }
        }
    </script>
</body>
</html>
